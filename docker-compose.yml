services:
  postgres:
    image: postgres:17
    container_name: my-saas-core-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_dev_password
      POSTGRES_DB: saas_core

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: